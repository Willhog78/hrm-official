name: Stage-1 verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Stage-1 regression suite
        run: python -m pytest -o addopts='' -q tests/test_stage1_coordination.py
      - name: HMT Stage-1 Gate (monolithic)
        run: python qualification/hmt_stage1_gate.py --output hmt_stage1_gate.json > /dev/null
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmt-stage1-gate
          path: hmt_stage1_gate.json
          if-no-files-found: warn
      - name: Stage-2 draft suite (quarantined; informational)
        working-directory: drafts/stage2
        run: python -m pytest -o addopts='' -q tests
