name: Stage-1 verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Stage-1 regression suite
        run: python -m pytest -o addopts='' -q tests/test_stage1_coordination.py
      - name: HMT Stage-1 Gate (monolithic)
        run: python qualification/hmt_stage1_gate.py --output hmt_stage1_gate.json > /dev/null
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmt-stage1-gate
          path: hmt_stage1_gate.json
          if-no-files-found: warn
      - name: Genesis regression suite
        run: python -m pytest -o addopts='' -q tests/genesis
      - name: Genesis G0 gate
        run: python qualification/genesis/run_g0_gate.py
      - name: Genesis G1 gate
        run: python qualification/genesis/run_g1_gate.py
      - name: Genesis G1.5 gate
        run: python qualification/genesis/run_g1_5_gate.py
      - name: Genesis G2 producer gate
        run: python qualification/genesis/run_g2_gate.py
      - name: Genesis G3 consumer gate
        run: python qualification/genesis/run_g3_gate.py
      - name: Genesis G4 autonomy gate
        run: python qualification/genesis/run_g4_autonomy_gate.py
      - name: Genesis G5 human biology gate
        run: python qualification/genesis/run_g5_human_biology_gate.py
      - name: Genesis G6 cognition gate
        run: python qualification/genesis/run_g6_cognition_gate.py
      - name: Genesis G7 emergence gate
        run: python qualification/genesis/run_g7_emergence_gate.py
      - name: Genesis G8 multi-population gate
        run: python qualification/genesis/run_g8_multi_population_gate.py
      - name: Genesis G9 observer isolation gate
        run: python qualification/genesis/run_g9_observer_gate.py
      - name: Genesis G10.1 scaled substrate gate
        run: python qualification/genesis/run_g10_1_scale_gate.py
      - name: Genesis G10.2 calibrated human gate
        run: python qualification/genesis/run_g10_2_human_calibration_gate.py
      - name: Stage-2 draft suite (quarantined; informational)
        working-directory: drafts/stage2
        run: python -m pytest -o addopts='' -q tests
